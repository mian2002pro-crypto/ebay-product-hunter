<!doctype html>
<html><head><meta charset="utf-8"><title>Miaan Hunter & Sourcer</title><link rel="stylesheet" href="popup.css"></head>
<body><main><header><h1>Miaan Hunter</h1><p id="status">Open an eBay or AliExpress product. Media can be downloaded directly.</p></header>
<div class="tabs"><button id="hunter-tab" class="tab active">Hunter</button><button id="sourcer-tab" class="tab">Sourcer</button></div>
<section id="hunter-view">
<div class="actions"><button id="hunt">Capture Selected Picture</button><button id="source" disabled>Send to Sourcer</button></div>
<div id="ali-media-controls" class="ali-media-controls" hidden>
  <button id="download-media" class="ali-download" title="Download selected images">↓</button>
  <button id="download-main-images" class="media-pill">Main images (0)</button>
  <button id="download-variant-images" class="media-pill">Variant images (0)</button>
  <button id="download-all-images" class="media-pill active">All (0)</button>
</div>
<div class="media-actions"><button id="download-pictures">Download Product Pictures</button><button id="download-video">Download Product Video</button></div>
<div id="preview"></div><div id="media-status"></div>
</section>
<section id="sourcer-view" hidden>
<div id="supplier-search"></div>
<button id="open-supplier" disabled>Search AliExpress</button>
<p class="notice">Supplier price not verified. Miaan Sourcer never invents supplier pricing, sales or trend data.</p>
</section>
</main><script src="popup.js"></script></body></html>

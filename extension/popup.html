<!doctype html>
<html><head><meta charset="utf-8"><title>Miaan Hunter & Sourcer</title><link rel="stylesheet" href="popup.css"></head>
<body><main><header><h1>Miaan Hunter</h1><p id="status">Open an eBay listing.</p></header>
<div class="tabs"><button id="hunter-tab" class="tab active">Hunter</button><button id="sourcer-tab" class="tab">Sourcer</button></div>
<section id="hunter-view">
<div class="actions"><button id="hunt">Capture Listing</button><button id="source" disabled>Send to Sourcer</button></div>
<div class="media-actions"><button id="download-pictures" disabled>Download Pictures</button><button id="download-video" disabled>Download Video</button></div>
<div id="preview"></div><div id="media-status"></div>
</section>
<section id="sourcer-view" hidden>
<div id="supplier-search"></div>
<button id="open-supplier" disabled>Search AliExpress</button>
<p class="notice">Supplier price not verified. Miaan Sourcer never invents supplier pricing, sales or trend data.</p>
</section>
</main><script src="popup.js"></script></body></html>
